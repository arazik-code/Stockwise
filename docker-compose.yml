services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: StockManagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/SMS.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=StockManagement;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__SecretKey=YourSuperSecretKeyAtLeast32CharactersLong!
      - Jwt__Issuer=StockManagementSystem
      - Jwt__Audience=StockManagementSystem
    volumes:
      - uploads:/app/wwwroot/uploads
      - ./src/SMS.API/appsettings.json:/app/appsettings.json
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: src/SMS.React
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
